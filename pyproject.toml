[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolbox-cli"
version = "0.1.0"
description = "A batteries-included developer toolbox CLI: hashing, encoding, JSON, timestamps, tokens and more."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goutam Singh", email = "25mcaa22@kristujayanti.com" }]
keywords = [
    "cli",
    "developer-tools",
    "devtoolbox",
    "hash",
    "base64",
    "json",
    "jwt",
    "password-generator",
    "typer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
devtoolbox = "devtoolbox.cli:main"

[project.urls]
Homepage = "https://github.com/goutamsingh22/devtoolbox-cli"
Repository = "https://github.com/goutamsingh22/devtoolbox-cli"
Issues = "https://github.com/goutamsingh22/devtoolbox-cli/issues"
Changelog = "https://github.com/goutamsingh22/devtoolbox-cli/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devtoolbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["devtoolbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# Typer requires option/argument calls in defaults and evaluates annotations at
# runtime, which makes PEP 604 unions unsafe on Python 3.9.
ignore = ["B008", "UP045"]
